<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Portal Access | CTOC</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030712;
            --bg-surface: rgba(17, 24, 39, 0.7);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --cyber-blue: #06b6d4;
            --cyber-blue-hover: #0891b2;
            --border-color: rgba(6, 182, 212, 0.15);
            --focus-ring: rgba(6, 182, 212, 0.25);
            --alert-red: #ef4444;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Tech Cyber Grid Background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient glowing orb */
        .glow-orb {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }

        .login-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.05), inset 0 0 20px rgba(6, 182, 212, 0.05);
            backdrop-filter: blur(12px);
            position: relative;
        }

        /* Top glow line indicator */
        .login-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyber-blue), transparent);
        }

        .header-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .clearance-badge {
            font-size: 11px;
            font-weight: 700;
            color: var(--cyber-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: inline-block;
            background-color: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.15);
            padding: 4px 12px;
            border-radius: 6px;
        }

        .portal-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .form-control {
            background-color: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            background-color: #111827;
            border-color: var(--cyber-blue);
            box-shadow: 0 0 12px var(--focus-ring);
            color: white;
        }

        .form-control::placeholder {
            color: #4b5563;
        }

        .btn-access {
            background-color: transparent;
            border: 1px solid var(--cyber-blue);
            color: var(--cyber-blue);
            font-weight: 600;
            font-size: 14px;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: inset 0 0 4px rgba(6, 182, 212, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-access:hover {
            background-color: var(--cyber-blue);
            color: #030712;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
            transform: translateY(-1px);
        }

        .btn-access:active {
            transform: translateY(0);
        }

        .alert-cyber {
            background-color: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            font-size: 13px;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-cyber svg {
            color: var(--alert-red);
            flex-shrink: 0;
        }

        .security-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="glow-orb"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="header-section">
                <span class="clearance-badge">LEVEL-3 AUTHENTICATION</span>
                <h2 class="portal-title">CYBER MONITOR SOC</h2>
            </div>

            {% if error %}
            <div class="alert-cyber">
                <!-- Lock Icon -->
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <span>{{ error }} - Session Terminated</span>
            </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Operator Username"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="mb-4">
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Operator Passkey"
                        required
                    >
                </div>

                <button class="btn btn-access">
                    Initialize Terminal
                </button>
            </form>

            <div class="security-footer">
                CTOC Secure Shell v2.9 // NODE_SHIELD_ACTIVE
            </div>
        </div>
    </div>
</body>
</html>
